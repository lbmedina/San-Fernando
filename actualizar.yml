name: Actualizar datos oficiales
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actualizar
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/recolectar.py docs/datos.json
      - name: Guardar si cambió
        run: |
          git config user.name "actualizador"
          git config user.email "actions@users.noreply.github.com"
          git add docs/datos.json
          git diff --staged --quiet || (git commit -m "Datos actualizados" && git push)
